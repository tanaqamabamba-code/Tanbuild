function PLPanel({state,month,yearPrefix}){
  const monthSales = state.sales.filter(s=> yearPrefix ? s.date.startsWith(yearPrefix) : monthKey(s.date)===month);
  const totalSales = monthSales.reduce((a,s)=>a+s.qty*s.price,0);
  const cogs = monthSales.reduce((a,s)=>a+(s.fifoPrice*s.qty),0);
  const grossProfit = totalSales - cogs;
  const monthExpenses = state.expenses.filter(e=> yearPrefix ? e.date.startsWith(yearPrefix) : monthKey(e.date)===month);
  const totalExpenses = monthExpenses.reduce((a,e)=>a+e.amount,0);
  const netProfit = grossProfit - totalExpenses;

  const expensesByType = useMemo(()=>{
    const map = {};
    monthExpenses.forEach(e=>{ map[e.accountType] = (map[e.accountType]||0) + e.amount; });
    return Object.entries(map).sort((a,b)=>b[1]-a[1]);
  },[monthExpenses]);

  return (
    <div>
      {monthSales.length===0 && monthExpenses.length===0 && (
        <div style={{fontSize:12,color:'var(--concrete)',marginBottom:14,padding:'10px 12px',background:'var(--bg-raised)',borderRadius:8}}>
          No sales or expenses logged in the app for this period yet.
        </div>
      )}
      <div style={{background:'var(--bg-card)',borderRadius:12,padding:'16px',marginBottom:16}}>
        <ReportRow label="Total sales" value={totalSales} />
        <ReportRow label="Cost of goods sold" value={-cogs} />
        <ReportRow label="Gross profit" value={grossProfit} bold accent />
      </div>

      <div style={{background:'var(--bg-card)',borderRadius:12,padding:'16px',marginBottom:16}}>
        <div style={{fontSize:12,color:'var(--concrete-light)',textTransform:'uppercase',letterSpacing:'0.06em',fontWeight:600,marginBottom:6}}>Expenses</div>
        {expensesByType.length===0 && <div style={{fontSize:13,color:'var(--concrete-light)',padding:'6px 0'}}>None logged this month.</div>}
        {expensesByType.map(([type,amt])=>(<ReportRow key={type} label={type} value={-amt} />))}
        <ReportRow label="Total expenses" value={-totalExpenses} bold />
      </div>

      <div style={{background:'var(--bg-card)',borderRadius:12,padding:'16px'}}>
        <ReportRow label="Net profit" value={netProfit} bold accent />
      </div>
    </div>
  );
}

function BalanceSheetPanel({state,setState,month}){
  // Cash: closing balance for this month, computed same way as Cash Flow panel
  const cash = computeClosingCash(state, month);

  // Inventory: FIFO stock value AS OF the end of the selected month (only counting
  // sales/purchases up to that month, not the live/current totals)
  const inventoryValue = useMemo(()=>{
    const cutoff = month + '-32'; // sorts after any real date in that month
    const scopedState = {
      ...state,
      sales: state.sales.filter(s=>monthKey(s.date)<=month),
      batches: state.batches.filter(b=>monthKey(b.date)<=month),
    };
    return state.items.reduce((sum,i)=> sum + fifoStockValue(scopedState,i.name).value, 0);
  },[state,month]);

  const accountsReceivable = useMemo(()=>openReceivablesTotal(state, month),[state,month]);
  const accountsPayable = useMemo(()=>openPayablesTotal(state, month),[state,month]);

  const totalAssets = cash + inventoryValue + accountsReceivable;

  const capital = state.capital || 0;
  const retainedEarnings = useMemo(()=>calculateRetainedEarnings(state, month),[state,month]);
  const drawings = useMemo(()=>totalDrawings(state, month),[state,month]);

  const totalEquity = capital + retainedEarnings - drawings;
  const totalLiabilities = accountsPayable;
  const balanceCheck = totalAssets - (totalLiabilities + totalEquity);

  function setCapital(v){
    const next = {...state, capital: Number(v)||0};
    setState(next);
    saveState(next);
  }

  const [drawDate,setDrawDate] = useState(new Date().toISOString().slice(0,10));
  const [drawAmount,setDrawAmount] = useState('');
  const [drawNotes,setDrawNotes] = useState('');
  const [showDrawForm,setShowDrawForm] = useState(false);

  function submitDrawing(){
    if(!drawAmount || Number(drawAmount)<=0) return;
    const next = {...state, drawings:[...(state.drawings||[]), {
      id:'draw_'+Date.now(), date:drawDate, amount:Number(drawAmount), notes:drawNotes.trim()
    }]};
    setState(next);
    saveState(next);
    setDrawAmount(''); setDrawNotes(''); setShowDrawForm(false);
  }

  const recentDrawings = [...(state.drawings||[])].filter(d=>monthKey(d.date)<=month).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);

  return (
    <div>
      <div style={{background:'var(--bg-card)',borderRadius:12,padding:'16px',marginBottom:16}}>
        <div style={{fontSize:12,color:'var(--concrete-light)',textTransform:'uppercase',letterSpacing:'0.06em',fontWeight:600,marginBottom:6}}>Assets</div>
        <ReportRow label="Cash" value={cash} />
        <ReportRow label="Accounts receivable" value={accountsReceivable} />
        <ReportRow label="Inventory (FIFO cost)" value={inventoryValue} />
        <ReportRow label="Total assets" value={totalAssets} bold />
      </div>

      <div style={{background:'var(--bg-card)',borderRadius:12,padding:'16px',marginBottom:16}}>
        <div style={{fontSize:12,color:'var(--concrete-light)',textTransform:'uppercase',letterSpacing:'0.06em',fontWeight:600,marginBottom:6}}>Liabilities</div>
        <ReportRow label="Accounts payable" value={accountsPayable} />
        <ReportRow label="Total liabilities" value={totalLiabilities} bold />
      </div>

      <Field label="Owner's capital">
        <input type="number" inputMode="decimal" style={inputStyle} value={capital} onChange={e=>setCapital(e.target.value)} placeholder="0.00" />
      </Field>

      <div style={{background:'var(--bg-card)',borderRadius:12,padding:'16px',marginBottom:16}}>
        <div style={{fontSize:12,color:'var(--concrete-light)',textTransform:'uppercase',letterSpacing:'0.06em',fontWeight:600,marginBottom:6}}>Equity</div>
        <ReportRow label="Capital" value={capital} />
        <ReportRow label="Retained earnings" value={retainedEarnings} />
        <ReportRow label="Owner drawings" value={-drawings} />
        <ReportRow label="Total equity" value={totalEquity} bold />
      </div>

      <div className="no-print" style={{marginBottom:16}}>
        {!showDrawForm ? (
          <div onClick={()=>setShowDrawForm(true)} style={{
            textAlign:'center', padding:'12px', borderRadius:10, border:'1px dashed var(--line)',
            color:'var(--accent)', fontSize:13, fontWeight:600, cursor:'pointer'
          }}>+ Log an owner drawing</div>
        ) : (
          <div style={{background:'var(--bg-card)',borderRadius:12,padding:14}}>
            <div style={{fontSize:12,color:'var(--concrete-light)',fontWeight:600,marginBottom:10}}>Log a drawing</div>
            <input type="date" style={{...inputStyle,marginBottom:8}} value={drawDate} onChange={e=>setDrawDate(e.target.value)} />
            <input type="number" inputMode="decimal" style={{...inputStyle,marginBottom:8}} value={drawAmount} onChange={e=>setDrawAmount(e.target.value)} placeholder="Amount taken out" />
            <input style={{...inputStyle,marginBottom:10}} value={drawNotes} onChange={e=>setDrawNotes(e.target.value)} placeholder="Notes (optional)" />
            <div style={{display:'flex',gap:8}}>
              <button onClick={submitDrawing} style={{flex:1,padding:'10px',borderRadius:8,border:'none',background:'var(--accent)',color:'#1c1b19',fontWeight:700,fontSize:13,cursor:'pointer'}}>Save</button>
              <button onClick={()=>setShowDrawForm(false)} style={{flex:1,padding:'10px',borderRadius:8,border:'1px solid var(--line)',background:'none',color:'var(--concrete-light)',fontWeight:600,fontSize:13,cursor:'pointer'}}>Cancel</button>
            </div>
          </div>
        )}
        {recentDrawings.length>0 && (
          <div style={{marginTop:12}}>
            {recentDrawings.map(d=>(
              <div key={d.id} style={{display:'flex',justifyContent:'space-between',padding:'8px 0',borderBottom:'1px solid var(--line)',fontSize:13}}>
                <span style={{color:'var(--concrete-light)'}}>{d.date}{d.notes ? ' \u00b7 '+d.notes : ''}</span>
                <span style={{fontWeight:600}}>{d.amount.toFixed(2)}</span>
              </div>
            ))}
          </div>
        )}
      </div>

      <div style={{background:'var(--bg-card)',borderRadius:12,padding:'16px'}}>
        <ReportRow label="Balance check" value={balanceCheck} bold accent />
        <div style={{fontSize:11,color:'var(--concrete)',marginTop:6}}>
          Should be 0. A non-zero number usually means liabilities aren\u2019t fully tracked yet (e.g. unpaid supplier bills) \u2014 not necessarily an error.
        </div>
      </div>
    </div>
  );
}

// Single source of truth for retained earnings: cumulative net profit across every
// month up to and including `month`. Anything that needs this number - Balance Sheet
// today, any future report - should call this rather than recompute it locally.
function calculateRetainedEarnings(state, month){
  let total = 0;
  const allMonths = new Set();
  state.sales.forEach(s=>allMonths.add(monthKey(s.date)));
  state.expenses.forEach(e=>allMonths.add(monthKey(e.date)));
  [...allMonths].filter(m=>m<=month).forEach(m=>{
    const mSales = state.sales.filter(s=>monthKey(s.date)===m);
    const sales = mSales.reduce((a,s)=>a+s.qty*s.price,0);
    const cogs = mSales.reduce((a,s)=>a+(s.fifoPrice*s.qty),0);
    const mExpenses = state.expenses.filter(e=>monthKey(e.date)===m).reduce((a,e)=>a+e.amount,0);
    total += (sales - cogs) - mExpenses;
  });
  return total;
}

function totalDrawings(state, asOfMonth){
  return (state.drawings||[])
    .filter(d=> !asOfMonth || monthKey(d.date)<=asOfMonth)
    .reduce((a,d)=>a+d.amount,0);
}

function computeClosingCash(state, month){
  const openingBalances = state.cashOpeningBalances || {};
  const ledger = state.ledger || [];
  // find the earliest month with data, walk forward month by month accumulating net cash flow,
  // so "closing cash" for any month reflects everything before it too - not just that month in isolation
  const allMonths = new Set();
  state.sales.forEach(s=>allMonths.add(monthKey(s.date)));
  state.batches.forEach(b=>allMonths.add(monthKey(b.date)));
  state.expenses.forEach(e=>allMonths.add(monthKey(e.date)));
  ledger.forEach(l=>{ if(l.settledDate) allMonths.add(monthKey(l.settledDate)); });
  (state.drawings||[]).forEach(d=>allMonths.add(monthKey(d.date)));
  Object.keys(openingBalances).forEach(m=>allMonths.add(m));
  const sorted = [...allMonths].filter(m=>m<=month).sort();
  if(sorted.length===0) return openingBalances[month] ?? 0;

  const firstMonth = sorted[0];
  let running = openingBalances[firstMonth] ?? 0;
  for(const m of sorted){
    if(m===firstMonth){
      // opening balance already set as starting point above; for firstMonth just add its net flow
    } else {
      // subsequent months start from where the previous one ended, unless a manual override was entered
      if(openingBalances[m] !== undefined) running = openingBalances[m];
    }
    // Only paid-in-cash transactions count directly; unpaid/credit ones don't move cash yet.
    const mSales = state.sales.filter(s=>monthKey(s.date)===m && (s.paymentStatus||'paid')==='paid').reduce((a,s)=>a+s.qty*s.price,0);
    const mPurchases = state.batches.filter(b=>monthKey(b.date)===m && (b.paymentStatus||'paid')==='paid').reduce((a,b)=>a+b.qty*b.price,0);
    const mExpenses = state.expenses.filter(e=>monthKey(e.date)===m && (e.paymentStatus||'paid')==='paid').reduce((a,e)=>a+e.amount,0);
    // Ledger settlements move cash in the month they're actually settled, not the original transaction date.
    const mReceipts = ledger.filter(l=>l.type==='receivable' && l.status==='settled' && l.settledDate && monthKey(l.settledDate)===m).reduce((a,l)=>a+l.amount,0);
    const mPayments = ledger.filter(l=>l.type==='payable' && l.status==='settled' && l.settledDate && monthKey(l.settledDate)===m).reduce((a,l)=>a+l.amount,0);
    const mDrawings = (state.drawings||[]).filter(d=>monthKey(d.date)===m).reduce((a,d)=>a+d.amount,0);
    running += (mSales + mReceipts) - (mPurchases + mExpenses + mPayments + mDrawings);
  }
  return running;
}

function CashFlowPanel({state,setState,month}){
  // Only count transactions actually PAID in cash - older records without a
  // paymentStatus field are treated as 'paid' (that's how the app behaved
  // before payment status existed, so this keeps old data consistent).
  const cashSales = useMemo(()=>state.sales
    .filter(s=>monthKey(s.date)===month && (s.paymentStatus||'paid')==='paid')
    .reduce((a,s)=>a+s.qty*s.price,0),[state.sales,month]);

  const cashPurchases = useMemo(()=>state.batches
    .filter(b=>monthKey(b.date)===month && (b.paymentStatus||'paid')==='paid')
    .reduce((a,b)=>a+b.qty*b.price,0),[state.batches,month]);

  const cashExpenses = useMemo(()=>state.expenses
    .filter(e=>monthKey(e.date)===month && (e.paymentStatus||'paid')==='paid')
    .reduce((a,e)=>a+e.amount,0),[state.expenses,month]);

  // Ledger settlements: money that actually changed hands this month, regardless
  // of when the original sale/purchase/expense happened. A receivable settled
  // this month = cash coming in now; a payable settled = cash going out now.
  const ledgerReceipts = useMemo(()=>(state.ledger||[])
    .filter(l=> l.type==='receivable' && l.status==='settled' && l.settledDate && monthKey(l.settledDate)===month)
    .reduce((a,l)=>a+l.amount,0),[state.ledger,month]);

  const ledgerPayments = useMemo(()=>(state.ledger||[])
    .filter(l=> l.type==='payable' && l.status==='settled' && l.settledDate && monthKey(l.settledDate)===month)
    .reduce((a,l)=>a+l.amount,0),[state.ledger,month]);

  const netCashFlow = (cashSales + ledgerReceipts) - (cashPurchases + cashExpenses + ledgerPayments);

  const openingBalances = state.cashOpeningBalances || {};
  const hasManualOpening = openingBalances[month] !== undefined;
  const closingBalance = computeClosingCash(state, month);
  const openingBalance = closingBalance - netCashFlow;

  function setOpeningBalance(v){
    const val = Number(v)||0;
    const next = {...state, cashOpeningBalances: {...openingBalances, [month]: val}};
    setState(next);
    saveState(next);
  }

  return (
    <div>
      <div style={{background:'var(--bg-card)',borderRadius:12,padding:'16px',marginBottom:16}}>
        <div style={{fontSize:12,color:'var(--concrete-light)',textTransform:'uppercase',letterSpacing:'0.06em',fontWeight:600,marginBottom:6}}>Operating activities</div>
        <ReportRow label="Cash sales" value={cashSales} />
        <ReportRow label="Cash paid for stock" value={-cashPurchases} />
        <ReportRow label="Cash paid for expenses" value={-cashExpenses} />
        {ledgerReceipts>0 && <ReportRow label="Received from customers (Owed)" value={ledgerReceipts} />}
        {ledgerPayments>0 && <ReportRow label="Paid to suppliers (Owed)" value={-ledgerPayments} />}
        <ReportRow label="Net cash flow" value={netCashFlow} bold accent />
      </div>

      <Field label={hasManualOpening ? "Opening cash balance (manually set)" : "Opening cash balance"}>
        <input type="number" inputMode="decimal" style={inputStyle}
          value={openingBalance.toFixed(2)} onChange={e=>setOpeningBalance(e.target.value)} placeholder="0.00" />
      </Field>
      <div style={{fontSize:12,color:'var(--concrete)',marginTop:-10,marginBottom:16}}>
        Only set this for your very first month \u2014 later months carry forward automatically.
      </div>

      <div style={{background:'var(--bg-card)',borderRadius:12,padding:'16px'}}>
        <ReportRow label="Opening balance" value={openingBalance} />
        <ReportRow label="Net cash flow" value={netCashFlow} />
        <ReportRow label="Closing balance" value={closingBalance} bold accent />
      </div>
    </div>
  );
}

function TopItemsPanel({state,month,yearPrefix}){
  const [rankBy,setRankBy] = useState('revenue'); // 'revenue' | 'grossProfit'

  const periodSales = useMemo(()=>{
    return state.sales.filter(s=> yearPrefix ? s.date.startsWith(yearPrefix) : monthKey(s.date)===month);
  },[state.sales,month,yearPrefix]);

  const byItem = useMemo(()=>{
    const map = {};
    periodSales.forEach(s=>{
      if(!map[s.item]) map[s.item] = { item:s.item, revenue:0, grossProfit:0, qty:0 };
      map[s.item].revenue += s.qty*s.price;
      map[s.item].grossProfit += s.grossProfit;
      map[s.item].qty += s.qty;
    });
    return Object.values(map);
  },[periodSales]);

  const ranked = useMemo(()=>{
    return [...byItem].sort((a,b)=> b[rankBy]-a[rankBy]);
  },[byItem,rankBy]);

  const topFive = ranked.slice(0,5);
  const bottomFive = [...ranked].reverse().slice(0,5).filter(r=>!topFive.includes(r));

  return (
    <div>
      {ranked.length===0 && (
        <div style={{fontSize:12,color:'var(--concrete)',marginBottom:14,padding:'10px 12px',background:'var(--bg-raised)',borderRadius:8}}>
          No sales logged in the app for this period yet.
        </div>
      )}

      {ranked.length>0 && (
        <div>
          <div className="no-print" style={{display:'flex',gap:6,marginBottom:16}}>
            {[{k:'revenue',l:'By revenue'},{k:'grossProfit',l:'By gross profit'}].map(t=>(
              <button key={t.k} onClick={()=>setRankBy(t.k)} style={{
                flex:1, padding:'9px 4px', borderRadius:8, fontSize:12, fontWeight:700, cursor:'pointer',
                border: rankBy===t.k ? '1px solid var(--accent)' : '1px solid var(--line)',
                background: rankBy===t.k ? 'var(--accent)' : 'none',
                color: rankBy===t.k ? '#1c1b19' : 'var(--concrete-light)'
              }}>{t.l}</button>
            ))}
          </div>

          <div style={{fontSize:12,color:'var(--concrete-light)',textTransform:'uppercase',letterSpacing:'0.06em',fontWeight:600,marginBottom:10}}>Top sellers</div>
          {topFive.map((r,idx)=>(
            <div key={r.item} style={{display:'flex',justifyContent:'space-between',padding:'10px 0',borderBottom:'1px solid var(--line)'}}>
              <span style={{fontSize:14}}>{idx+1}. {r.item} <span style={{color:'var(--concrete-light)'}}>({r.qty})</span></span>
              <span style={{fontSize:14,fontWeight:600,color:'var(--good)'}}>{(rankBy==='revenue'?r.revenue:r.grossProfit).toFixed(2)}</span>
            </div>
          ))}

          {ranked.length>5 && (
            <div>
              <div style={{fontSize:12,color:'var(--concrete-light)',textTransform:'uppercase',letterSpacing:'0.06em',fontWeight:600,marginTop:20,marginBottom:10}}>Slow movers</div>
              {bottomFive.map((r,idx)=>(
                <div key={r.item} style={{display:'flex',justifyContent:'space-between',padding:'10px 0',borderBottom:'1px solid var(--line)'}}>
                  <span style={{fontSize:14}}>{r.item} <span style={{color:'var(--concrete-light)'}}>({r.qty})</span></span>
                  <span style={{fontSize:14,fontWeight:600,color:'var(--concrete-light)'}}>{(rankBy==='revenue'?r.revenue:r.grossProfit).toFixed(2)}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function downloadJSON(data, filename){
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function validateBackup(data){
  if(!data || typeof data !== 'object') return 'File doesn\u2019t look like a valid backup.';
  const requiredArrays = ['items','batches','sales','agents','expenses','ledger','staff','payroll'];
  for(const key of requiredArrays){
    if(!Array.isArray(data[key])) return `Missing or invalid "${key}" \u2014 this doesn\u2019t look like a Tanbuild backup file.`;
  }
  return null; // valid
}

function BackupPanel({state,setState,toast,onClose}){
  const fileInputRef = useRef(null);
  const [confirmImport,setConfirmImport] = useState(null); // parsed data pending confirmation
  const [pendingFileName,setPendingFileName] = useState('');

  function exportBackup(){
    const filename = `tanbuild-backup-${new Date().toISOString().slice(0,10)}.json`;
    downloadJSON(state, filename);
    toast('Backup downloaded','good');
  }

  function handleFileSelect(e){
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      let parsed;
      try{
        parsed = JSON.parse(evt.target.result);
      }catch(err){
        toast('That file isn\u2019t valid JSON.','bad');
        return;
      }
      const error = validateBackup(parsed);
      if(error){
        toast(error,'bad');
        return;
      }
      setConfirmImport(parsed);
      setPendingFileName(file.name);
    };
    reader.readAsText(file);
    e.target.value = ''; // allow re-selecting the same file later
  }

  function confirmRestore(){
    setState(confirmImport);
    saveState(confirmImport);
    toast('Backup restored','good');
    setConfirmImport(null);
    onClose();
  }

  const summary = state ? {
    sales: state.sales.length,
    items: state.items.length,
    expenses: state.expenses.length,
    ledger: (state.ledger||[]).length,
    staff: (state.staff||[]).length,
  } : null;

  return (
    <div style={{
      position:'fixed', inset:0, background:'rgba(0,0,0,0.6)', zIndex:100,
      display:'flex', alignItems:'flex-end', justifyContent:'center'
    }} onClick={onClose}>
      <div onClick={e=>e.stopPropagation()} style={{
        background:'var(--bg-raised)', borderRadius:'16px 16px 0 0', padding:'24px 20px',
        width:'100%', maxWidth:480, maxHeight:'85vh', overflowY:'auto'
      }}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
          <span style={{fontSize:18,fontWeight:700,fontFamily:"system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"}}>Backup</span>
          <span onClick={onClose} style={{fontSize:20,color:'var(--concrete-light)',cursor:'pointer',padding:4}}>\u2715</span>
        </div>

        {confirmImport ? (
          <div>
            <div style={{fontSize:14,marginBottom:12}}>
              Restore from <span style={{fontWeight:600}}>{pendingFileName}</span>?
            </div>
            <div style={{background:'var(--bg-card)',borderRadius:10,padding:14,marginBottom:16,fontSize:13,color:'var(--concrete-light)'}}>
              This file has {confirmImport.sales.length} sales, {confirmImport.items.length} items, {confirmImport.expenses.length} expenses.
            </div>
            <div style={{fontSize:13,color:'var(--bad)',marginBottom:16}}>
              This will replace everything currently in the app with the contents of this file. Your current data will be lost unless you\u2019ve backed it up separately.
            </div>
            <div style={{display:'flex',gap:8}}>
              <button onClick={confirmRestore} style={{flex:1,padding:'12px',borderRadius:8,border:'none',background:'var(--bad)',color:'#fff',fontWeight:700,fontSize:14,cursor:'pointer'}}>Replace everything</button>
              <button onClick={()=>setConfirmImport(null)} style={{flex:1,padding:'12px',borderRadius:8,border:'1px solid var(--line)',background:'none',color:'var(--concrete-light)',fontWeight:600,fontSize:14,cursor:'pointer'}}>Cancel</button>
            </div>
          </div>
        ) : (
          <div>
            {summary && (
              <div style={{background:'var(--bg-card)',borderRadius:10,padding:14,marginBottom:20,fontSize:13,color:'var(--concrete-light)'}}>
                Currently on this device: {summary.sales} sales, {summary.items} items, {summary.expenses} expenses, {summary.ledger} ledger entries, {summary.staff} staff.
              </div>
            )}

            <div style={{fontSize:13,color:'var(--concrete-light)',marginBottom:10}}>
              Everything in this app lives on this device only. Download a backup regularly and keep it somewhere safe (email it to yourself, save to Google Drive) so you never lose your data.
            </div>

            <button onClick={exportBackup} style={{
              width:'100%', padding:'14px', borderRadius:12, border:'none', marginBottom:12,
              background:'var(--accent)', color:'#1c1b19', fontSize:15, fontWeight:700, cursor:'pointer'
            }}>Download backup</button>

            <button onClick={()=>fileInputRef.current.click()} style={{
              width:'100%', padding:'14px', borderRadius:12, border:'1px solid var(--line)',
              background:'none', color:'var(--paper)', fontSize:15, fontWeight:700, cursor:'pointer'
            }}>Restore from backup</button>
            <input ref={fileInputRef} type="file" accept="application/json,.json" onChange={handleFileSelect} style={{display:'none'}} />
          </div>
        )}
      </div>
    </div>
  );
}

function Toast({msg}){
  if(!msg) return null;
  return (
    <div style={{
      position:'fixed', bottom:90, left:'50%', transform:'translateX(-50%)',
      background: msg.kind==='bad' ? 'var(--bad)' : 'var(--good)',
      color:'#fff', padding:'10px 18px', borderRadius:99, fontSize:14, fontWeight:600,
      boxShadow:'0 8px 20px rgba(0,0,0,0.3)', zIndex:50, maxWidth:'85%', textAlign:'center'
    }}>{msg.text}</div>
  );
}

function TabBar({tab,setTab}){
  const tabs = [
    {key:'sales', label:'Sale'},
    {key:'history', label:'History'},
    {key:'stock', label:'Stock'},
    {key:'newstock', label:'Buy'},
    {key:'expenses', label:'Expense'},
    {key:'loss', label:'Loss'},
    {key:'ledger', label:'Owed'},
    {key:'hr', label:'Staff'},
    {key:'health', label:'Health'},
  ];
  return (
    <div className="no-print" style={{
      position:'fixed', bottom:0, left:0, right:0, maxWidth:480, margin:'0 auto',
      display:'flex', overflowX:'auto', background:'var(--bg-raised)', borderTop:'1px solid var(--line)',
      paddingBottom:'env(safe-area-inset-bottom)', WebkitOverflowScrolling:'touch'
    }}>
      {tabs.map(t=>(
        <button key={t.key} onClick={()=>setTab(t.key)} style={{
          flex:'1 0 60px', padding:'12px 4px 10px', background:'none', border:'none',
          color: tab===t.key ? 'var(--accent)' : 'var(--concrete-light)',
          fontWeight: tab===t.key ? 700:500, fontSize:10.5, cursor:'pointer', whiteSpace:'nowrap',
          fontFamily:"system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"
        }}>{t.label}</button>

      ))}
    </div>
  );
}

function App(){
  const [state,setState] = useState(null);
  const [tab,setTab] = useState('sales');
  const [toastMsg,setToastMsg] = useState(null);
  const [showBackup,setShowBackup] = useState(false);

  useEffect(()=>{
    (async ()=>{
      const loaded = await loadState();
      setState(loaded || initialState());
    })();
  },[]);

  function toast(text,kind){
    setToastMsg({text,kind});
    setTimeout(()=>setToastMsg(null), 2200);
  }

  if(!state){
    return <div style={{padding:40,textAlign:'center',color:'var(--concrete-light)'}}>Loading…</div>;
  }

  return (
    <React.Fragment>
      <TopBar tab={tab} onBackupClick={()=>setShowBackup(true)} />
      {tab==='sales' && <SalesTab state={state} setState={setState} toast={toast} />}
      {tab==='history' && <HistoryTab state={state} setState={setState} toast={toast} />}
      {tab==='stock' && <StockTab state={state} setState={setState} toast={toast} />}
      {tab==='newstock' && <NewstockTab state={state} setState={setState} toast={toast} />}
      {tab==='expenses' && <ExpensesTab state={state} setState={setState} toast={toast} />}
      {tab==='loss' && <DamageLossTab state={state} setState={setState} toast={toast} />}
      {tab==='ledger' && <LedgerTab state={state} setState={setState} toast={toast} />}
      {tab==='hr' && <HRTab state={state} setState={setState} toast={toast} />}
      {tab==='health' && <HealthTab state={state} setState={setState} toast={toast} />}
      {showBackup && <BackupPanel state={state} setState={setState} toast={toast} onClose={()=>setShowBackup(false)} />}
      <Toast msg={toastMsg} />
      <TabBar tab={tab} setTab={setTab} />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
